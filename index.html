<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="四則演算 練習サイト - たし算・ひき算・かけ算・わり算。1〜3けた対応。">
<title>四則演算 練習サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-pattern" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="header-text">
        <h1>
          四則演算 練習サイト
          <svg class="title-underline" viewBox="0 0 220 18" aria-hidden="true">
            <path d="M4 10 C 40 2, 70 16, 110 8 C 150 1, 180 15, 216 6" />
          </svg>
        </h1>
        <p class="sub" id="subTitle">1けたのたし算</p>
      </div>
      <button type="button" id="resetBtn" class="btn-ghost" title="スコアをリセット">
        <span class="btn-ghost-icon">✕</span>リセット
      </button>
    </header>

    <section class="controls" aria-label="練習メニュー">
      <div class="control-group">
        <span class="control-label">演算</span>
        <div class="chip-row" id="opMenu" role="tablist">
          <button type="button" class="chip active" data-op="add" role="tab" aria-selected="true">たし算</button>
          <button type="button" class="chip" data-op="sub" role="tab" aria-selected="false">ひき算</button>
          <button type="button" class="chip" data-op="mul" role="tab" aria-selected="false">かけ算</button>
          <button type="button" class="chip" data-op="div" role="tab" aria-selected="false">わり算</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">けた数</span>
        <div class="chip-row" id="digitMenu" role="tablist">
          <button type="button" class="chip active" data-digits="1" role="tab" aria-selected="true">1けた</button>
          <button type="button" class="chip" data-digits="2" role="tab" aria-selected="false">2けた</button>
          <button type="button" class="chip" data-digits="3" role="tab" aria-selected="false" id="digit3Btn">3けた</button>
        </div>
      </div>
    </section>

    <section class="stats" aria-label="スコア">
      <div class="stat stat-ok">
        <span class="stat-label">正解</span>
        <span class="stat-value ok" id="correctCount">0</span>
      </div>
      <div class="stat stat-ng">
        <span class="stat-label">不正解</span>
        <span class="stat-value ng" id="wrongCount">0</span>
      </div>
      <div class="stat stat-streak">
        <span class="stat-label">連続</span>
        <span class="stat-value streak" id="streakCount">0</span>
      </div>
    </section>

    <main class="card">
      
      <div class="feedback empty" id="feedback" aria-live="polite">
        <span id="feedbackText"></span>
        <button type="button" id="nextProblemBtn" class="btn-next" hidden>次へ ⏎</button>
      </div>

      <div class="problem" id="problem" aria-live="polite">
        <span id="numA">0</span>
        <span class="op" id="opSymbol">＋</span>
        <span id="numB">0</span>
        <span class="eq">＝</span>
        <span class="answer-wrap">
          <button type="button" class="answer-area" id="answerArea" aria-label="答えの入力欄">
            <span class="answer-slot" id="answerDisplay">?</span>
            <span class="caret" aria-hidden="true"></span>
          </button>
        </span>
      </div>

      <p class="input-hint" id="inputHint"></p>
      <p class="hint-note" id="hintNote"></p>

      <div class="answer-field">
        <input
          type="text"
          id="answerInput"
          inputmode="none"
          pattern="[0-9]*"
          autocomplete="off"
          aria-label="答え"
          maxlength="7"
        >
      </div>

      <div class="keypad" id="keypad" aria-label="数字キー">
        <button type="button" class="key" data-key="7">7</button>
        <button type="button" class="key" data-key="8">8</button>
        <button type="button" class="key" data-key="9">9</button>
        <button type="button" class="key key-action" data-key="clear" aria-label="すべて消す">C</button>
        
        <button type="button" class="key" data-key="4">4</button>
        <button type="button" class="key" data-key="5">5</button>
        <button type="button" class="key" data-key="6">6</button>
        <button type="button" class="key key-action" data-key="back" aria-label="1文字消す">⌫</button>
        
        <button type="button" class="key" data-key="1">1</button>
        <button type="button" class="key" data-key="2">2</button>
        <button type="button" class="key" data-key="3">3</button>
        
        <button type="button" class="key key-zero" data-key="0">0</button>
        <button type="button" class="key key-submit" data-key="submit">答える</button>
      </div>

    </main>

    <p class="footer-note">✎ テンキーとキーボード、どちらでも答えられます</p>
  </div>

<script src="js/app.js"></script>
</body>
</html>
