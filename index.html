<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="四則演算 練習サイト - 筆算の途中計算・手書きメモ・消しゴム・視覚モデル対応のインタラクティブ算数ドリル">
<title>四則演算 ステップアップ練習ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

<style>
:root {
  /* 紙・ノートカラー */
  --paper: #fffdf7;
  --paper-edge: #f4ecd6;
  --grid: rgba(47, 111, 168, 0.09);
  --margin-red: rgba(216, 52, 42, 0.25);
  --line: #e6dac0;
  --line-strong: #d2c095;

  /* テキスト */
  --ink: #1e242b;
  --muted: #5a626a;

  /* アクセントカラー */
  --blue-pen: #1a568e;
  --blue-soft: #eaf2f8;
  --red-pen: #d12e24;
  --ok: #237645;
  --ok-soft: #e6f4ec;
  --ng: #c8241a;
  --ng-soft: #fbeae7;
  --gold: #b87c14;
  --gold-soft: #fcf3df;
  --purple: #6b3fa0;

  --shadow: 0 2px 4px rgba(17, 17, 17, 0.04), 0 12px 28px rgba(17, 17, 17, 0.07);
  --radius: 16px;
  --font-ui: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "Courier New", Consolas, "Zen Maru Gothic", monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  touch-action: manipulation;
}

body {
  padding: 16px 12px 48px;
}

/* ノート方眼背景 */
.bg-pattern {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, transparent 36px, var(--margin-red) 36px, var(--margin-red) 38px, transparent 38px),
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px, 24px 24px;
  background-repeat: no-repeat, repeat, repeat;
}

@media (max-width: 600px) {
  .bg-pattern {
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 20px 20px, 20px 20px;
  }
}

button {
  font-family: inherit;
}

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  transition: max-width 0.25s ease;
}

.app.is-vertical-app {
  max-width: 820px;
}

/* ヘッダー・ステータスバー */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.85);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  font-size: 0.8rem;
  backdrop-filter: blur(4px);
}

.daily-badges {
  display: flex;
  align-items: center;
  gap: 12px;
}

.badge-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--ink);
}

.badge-val {
  font-weight: 900;
  color: var(--blue-pen);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.icon-btn {
  appearance: none;
  border: 1.5px solid var(--line-strong);
  background: #fff;
  color: var(--ink);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
}

.icon-btn:hover {
  border-color: var(--blue-pen);
  background: var(--blue-soft);
}

.icon-btn.active {
  background: var(--blue-pen);
  color: #fff;
  border-color: var(--blue-pen);
}

/* タイトルヘッダー */
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.header h1 {
  margin: 0;
  font-size: 1.65rem;
  font-weight: 900;
  letter-spacing: 0.01em;
  line-height: 1.2;
  color: var(--ink);
  position: relative;
  display: inline-block;
}

.title-underline {
  display: block;
  width: 100%;
  height: 8px;
  margin-top: -1px;
}

.title-underline path {
  fill: none;
  stroke: var(--red-pen);
  stroke-width: 3.5;
  stroke-linecap: round;
}

.sub {
  margin: 2px 0 0;
  font-size: 0.92rem;
  color: var(--muted);
}

/* コントロールパネル */
.controls {
  display: grid;
  gap: 10px;
  margin-bottom: 12px;
  background: rgba(255, 255, 255, 0.7);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
}

.control-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.control-label {
  font-size: 0.78rem;
  font-weight: 900;
  color: var(--muted);
  min-width: 52px;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
}

.chip {
  appearance: none;
  border: 1.5px solid var(--line-strong);
  background: #fffaef;
  color: var(--muted);
  border-radius: 8px;
  padding: 5px 11px;
  font-size: 0.85rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.chip:hover:not(:disabled) {
  border-color: var(--blue-pen);
  color: var(--ink);
}

#opMenu .chip.active {
  background: var(--blue-pen);
  border-color: var(--blue-pen);
  color: #fff;
  box-shadow: 0 2px 6px rgba(26, 86, 142, 0.25);
}

#subCategoryMenu .chip.active {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
  box-shadow: 0 2px 6px rgba(35, 118, 69, 0.25);
}

#digitMenu .chip {
  border-radius: 999px;
  font-size: 0.82rem;
}

#digitMenu .chip.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
  box-shadow: 0 2px 6px rgba(184, 124, 20, 0.25);
}

#gameModeMenu .chip {
  font-size: 0.82rem;
  background: #fff;
}

#gameModeMenu .chip.active {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}

#gameModeMenu .chip[data-mode="review"].active {
  background: var(--purple);
  border-color: var(--purple);
}

.badge-count {
  display: inline-block;
  background: var(--ng);
  color: #fff;
  font-size: 0.7rem;
  padding: 1px 6px;
  border-radius: 999px;
  margin-left: 4px;
  vertical-align: middle;
}

/* スコアボード＆タイマー */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.stat {
  background: #fffdf9;
  border: 2px dashed var(--line-strong);
  border-radius: 12px;
  padding: 6px 4px;
  text-align: center;
}

.stat-ok { border-color: rgba(35, 118, 69, 0.4); }
.stat-ng { border-color: rgba(200, 36, 26, 0.35); }
.stat-streak { border-color: rgba(184, 124, 20, 0.45); }
.stat-timer { border-color: rgba(26, 86, 142, 0.4); }

.stat-label {
  display: block;
  font-size: 0.72rem;
  color: var(--muted);
  margin-bottom: 2px;
}

.stat-value {
  font-size: 1.35rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.stat-value.ok { color: var(--ok); }
.stat-value.ng { color: var(--ng); }
.stat-value.streak { color: var(--gold); }
.stat-value.timer { color: var(--blue-pen); font-size: 1.2rem; }

/* プログレスバー（10問モード用） */
.progress-wrap {
  margin-bottom: 12px;
  display: none;
}

.progress-wrap.active {
  display: block;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 4px;
}

.progress-bar {
  height: 10px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--blue-pen), var(--ok));
  border-radius: 999px;
  transition: width 0.25s ease;
}

/* メインカード */
.card {
  position: relative;
  background: #fdf6e4;
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 18px 18px 22px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* カード内ツールバー */
.card-tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
  position: relative;
  z-index: 3;
}

.tool-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tool-btn {
  appearance: none;
  border: 1.5px solid var(--line-strong);
  background: rgba(255, 255, 255, 0.85);
  color: var(--muted);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
}

.tool-btn:hover:not(:disabled) {
  border-color: var(--blue-pen);
  color: var(--ink);
}

.tool-btn.active {
  background: var(--blue-soft);
  border-color: var(--blue-pen);
  color: var(--blue-pen);
}

.tool-btn.eraser-active {
  background: var(--ng-soft);
  border-color: var(--red-pen);
  color: var(--red-pen);
}

.tool-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.tool-btn[hidden] {
  display: none !important;
}

/* フィードバック欄 */
.feedback {
  min-height: 46px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  text-align: center;
  font-size: 1.05rem;
  font-weight: 900;
  border-radius: 10px;
  padding: 8px 14px;
  position: relative;
  z-index: 3;
  transition: all 0.2s ease;
}

.feedback.ok {
  color: var(--ok);
  background: var(--ok-soft);
  font-size: 1.2rem;
}

.feedback.ng {
  color: var(--ng);
  background: var(--ng-soft);
  font-size: 1.15rem;
}

.feedback.empty {
  background: transparent;
  min-height: 32px;
}

.btn-next {
  appearance: none;
  font-size: 0.9rem;
  font-weight: 900;
  color: #fff;
  background: var(--ng);
  border: none;
  border-radius: 999px;
  padding: 6px 18px;
  cursor: pointer;
  box-shadow: 0 3px 0 #8f1912;
}

.btn-next.ok-next {
  background: var(--ok);
  box-shadow: 0 3px 0 #16522e;
}

.btn-next:active {
  transform: translateY(2px);
}

/* =========================================================
   レイアウトシステム：通常（1カラム） vs 筆算（左右2カラム）
   ========================================================= */
.card-body {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* 筆算モード時：左に筆算＋手書き領域、右に答え入力＋テンキー/解答 */
.card.is-vertical-layout .card-body {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 20px;
  align-items: start;
}

@media (max-width: 620px) {
  .card.is-vertical-layout .card-body {
    grid-template-columns: 1fr;
    gap: 16px;
  }
}

.left-pane {
  width: 100%;
  display: flex;
  flex-direction: column;
}

.right-pane {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 問題＆手書きメモワークスペース */
.workspace {
  position: relative;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 8px;
  border-radius: 14px;
  transition: min-height 0.2s ease;
}

/* 筆算モード時は下に計算を書けるよう高さを大きく確保し、問題を上部に配置 */
.card.is-vertical-layout .workspace {
  min-height: 360px;
  justify-content: flex-start;
  padding-top: 26px;
  background-color: rgba(255, 255, 255, 0.65);
  background-image:
    linear-gradient(to right, rgba(47, 111, 168, 0.12) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(47, 111, 168, 0.12) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 2px dashed var(--blue-pen);
}

.scratch-guide {
  display: none;
  position: absolute;
  bottom: 8px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.75rem;
  color: var(--blue-pen);
  opacity: 0.75;
  pointer-events: none;
  user-select: none;
}

.card.is-vertical-layout .scratch-guide {
  display: block;
}

.scratch-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  touch-action: none;
  border-radius: 12px;
}

.scratch-canvas.active {
  pointer-events: auto;
  cursor: crosshair;
}

.scratch-canvas.active.is-eraser {
  cursor: cell;
}

.card:not(.is-vertical-layout) .scratch-canvas.active {
  background: rgba(255, 255, 255, 0.3);
  border: 2px dashed var(--blue-pen);
}

/* 横書き問題表示（通常モード） */
.problem {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: center;
  gap: 6px 6px;
  font-size: 3.5rem;
  font-weight: 900;
  line-height: 1.2;
  color: var(--ink);
  user-select: none;
  position: relative;
  z-index: 1;
}

.problem.compact { font-size: 2.9rem; }
.problem.tight { font-size: 2.2rem; }

.problem .op { margin: 0 2px; }
.problem .eq { color: var(--line-strong); margin: 0 2px; }

/* 筆算（縦書き）問題表示（左ペイン上部・下に？は出さない） */
.vertical-problem-box {
  display: none;
  position: relative;
  z-index: 1;
  user-select: none;
  pointer-events: none;
  font-family: var(--font-mono);
  font-weight: 900;
  color: var(--ink);
}

.card.is-vertical-layout .problem {
  display: none;
}

.card.is-vertical-layout .vertical-problem-box {
  display: block;
}

/* ＋, −, × の筆算テーブル */
.v-std-grid {
  display: inline-grid;
  grid-template-columns: auto auto;
  justify-items: end;
  align-items: baseline;
  font-size: 2.6rem;
  line-height: 1.15;
  letter-spacing: 0.18em;
  padding: 4px 12px 6px;
  border-bottom: 4px solid var(--ink);
}

.v-std-grid .v-num-a {
  grid-column: 2;
  grid-row: 1;
}

.v-std-grid .v-op {
  grid-column: 1;
  grid-row: 2;
  padding-right: 10px;
  letter-spacing: 0;
}

.v-std-grid .v-num-b {
  grid-column: 2;
  grid-row: 2;
}

/* =========================================================
   ÷（わり算）の筆算表示（76÷3のような曲線払いの根号風記号）
   ========================================================= */
.v-div-grid {
  display: inline-flex;
  align-items: center;
  font-size: 2.6rem;
  line-height: 1.15;
  margin-top: 28px; /* 上に商を書くための余白 */
  padding: 4px 12px;
}

.v-div-divisor {
  letter-spacing: 0.1em;
  padding-right: 2px;
  padding-top: 4px;
}

.v-div-bracket-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  border-top: 4px solid var(--ink);
  padding: 4px 10px 2px 16px;
  margin-left: 12px;
}

/* 平方根のような左下の曲線払いSVG */
.v-div-curve-svg {
  position: absolute;
  left: -16px;
  top: -4px;
  width: 22px;
  height: calc(100% + 10px);
  overflow: visible;
  pointer-events: none;
}

.v-div-dividend {
  letter-spacing: 0.18em;
}

/* 答えの入力欄（通常時は式の右、筆算時は右カラム上部） */
.answer-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.right-answer-header {
  display: none;
  width: 100%;
  max-width: 360px;
  background: rgba(255, 255, 255, 0.85);
  border: 2px solid var(--line-strong);
  border-radius: 14px;
  padding: 10px 16px;
  margin-bottom: 12px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.card.is-vertical-layout .right-answer-header {
  display: flex;
}

.right-answer-label {
  font-size: 1rem;
  font-weight: 900;
  color: var(--muted);
  white-space: nowrap;
}

.answer-area {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 1.8em;
  min-height: 1.25em;
  padding: 2px 12px 4px;
  border: none;
  border-bottom: 4px solid var(--line-strong);
  border-radius: 8px 8px 0 0;
  background: #ffffff;
  color: var(--ink);
  font: inherit;
  line-height: 1;
  cursor: text;
  transition: all 0.12s ease;
}

.card.is-vertical-layout .answer-area {
  font-size: 2.3rem;
  font-weight: 900;
  flex: 1;
  min-width: 120px;
  border: 2px solid var(--line-strong);
  border-bottom-width: 4px;
  border-radius: 10px;
  padding: 6px 14px;
}

.answer-area.is-focused {
  border-color: var(--blue-pen);
  box-shadow: 0 4px 12px rgba(26, 86, 142, 0.14);
}

.answer-slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 0.8em;
  color: #999;
}

.answer-area.is-focused .answer-slot,
.answer-slot.filled {
  color: var(--ink);
}

.answer-area.is-ok {
  background: var(--ok-soft);
  color: var(--ok);
  border-color: var(--ok);
}
.answer-area.is-ok .answer-slot { color: var(--ok); }

.answer-area.is-ng {
  background: var(--ng-soft);
  color: var(--ng);
  border-color: var(--ng);
}
.answer-area.is-ng .answer-slot { color: var(--ng); }

.caret {
  display: none;
  width: 3.5px;
  height: 0.9em;
  margin-left: 2px;
  border-radius: 2px;
  background: var(--blue-pen);
}

.answer-area.is-focused .caret {
  display: inline-block;
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  0%, 45% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

/* テンキー */
.keypad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  position: relative;
  z-index: 3;
}

.card.is-vertical-layout .keypad {
  max-width: 360px;
}

.keypad[hidden] {
  display: none !important;
}

.key {
  appearance: none;
  height: 62px;
  border: 2px solid var(--line-strong);
  border-radius: 12px;
  background: #fffaef;
  color: var(--ink);
  font-size: 1.8rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--line-strong);
  transition: background 0.1s ease, transform 0.06s ease, box-shadow 0.06s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.key:hover:not(:disabled) {
  background: #f4ecd6;
  border-color: var(--ink);
}

.key:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--line-strong);
}

.key-action {
  font-size: 1.35rem;
  background: #f9f2e2;
}

.key-zero {
  grid-column: 1 / 3;
}

.key-submit {
  grid-column: 3 / 5;
  font-size: 1.05rem;
  background: var(--blue-pen);
  color: #fff;
  border-color: #123e68;
  box-shadow: 0 4px 0 #123e68;
}

.key-submit:hover:not(:disabled) {
  background: #154878;
}

.key:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none;
}

/* =========================================================
   筆算の途中計算・解答パネル（キーボードの位置に切り替わり表示）
   ========================================================= */
.vertical-solution-panel {
  width: 100%;
  max-width: 360px;
  background: #ffffff;
  border: 2.5px solid var(--blue-pen);
  border-radius: 16px;
  padding: 14px 16px 16px;
  box-shadow: 0 6px 18px rgba(26, 86, 142, 0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  animation: fadeIn 0.2s ease;
}

.vertical-solution-panel[hidden] {
  display: none !important;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.v-sol-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1.5px dashed var(--line-strong);
  padding-bottom: 6px;
  font-size: 0.88rem;
  color: var(--blue-pen);
  font-weight: 900;
}

.v-sol-body {
  width: 100%;
  display: flex;
  justify-content: center;
  overflow-x: auto;
  padding: 6px 4px;
}

/* 筆算解答グリッド共通スタイル */
.hissan-sol-table {
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 1.45rem;
  font-weight: 900;
  line-height: 1.25;
  color: var(--ink);
}

.hissan-sol-table td {
  width: 1.45em;
  height: 1.35em;
  text-align: center;
  vertical-align: middle;
  padding: 0;
  position: relative;
}

/* くりあがり・くりさがりの小さな補助数字 */

/* たし算のくりあがりの小さな数字 */
.carry-digit {
  position: absolute;
  bottom: 0.1em;
  right: -0.4em; /* 位と位の間に配置するため右に少しはみ出させる */
  font-size: 0.6em;
  color: var(--red-pen); /* 添付画像に合わせて水色にしています */
  font-weight: 900;
  line-height: 1;
}


.hissan-sol-table tr.carry-row td {
  font-size: 0.8rem;
  height: 1.2em;
  color: var(--red-pen);
  vertical-align: bottom;
}

/* 筆算の横線 */
.hissan-sol-table tr.line-bottom td {
  border-bottom: 3px solid var(--ink);
}

.hissan-sol-table tr.ans-row td {
  color: var(--ok);
  padding-top: 2px;
}

.hissan-sol-table tr.partial-row td {
  color: var(--blue-pen);
}

/* くりさがりで斜線を引いた数字 */
.crossed-digit {
  position: relative;
  color: #999;
}
.crossed-digit::after {
  content: "";
  position: absolute;
  left: 15%;
  right: 15%;
  top: 48%;
  border-top: 2.5px solid var(--red-pen);
  transform: rotate(25deg);
}

/* わり算筆算の解答セル装飾（曲線の根号風記号＆全桁横棒） */
.hissan-sol-table td.div-curve-cell {
  border-top: 3px solid var(--ink);
  padding-left: 0.25em;
}
.hissan-sol-table td.div-top-bar {
  border-top: 3px solid var(--ink);
}
.hissan-sol-table td.sub-line-bottom {
  border-bottom: 2.5px solid var(--ink);
}

.sol-div-curve-svg {
  position: absolute;
  left: -0.42em;
  top: -3px;
  width: 0.65em;
  height: calc(100% + 7px);
  overflow: visible;
  pointer-events: none;
}

.v-sol-note {
  margin: 0;
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.4;
}

.v-sol-next-btn {
  appearance: none;
  width: 100%;
  padding: 10px 16px;
  border-radius: 12px;
  border: none;
  background: var(--blue-pen);
  color: #fff;
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 0 #123e68;
  transition: transform 0.08s ease;
}

.v-sol-next-btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #123e68;
}

/* 視覚モデル（10フレーム等）エリア */
.visual-aid {
  margin-top: 10px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.85);
  border: 1.5px dashed var(--line-strong);
  border-radius: 12px;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.visual-aid.active {
  display: flex;
}

.ten-frames-wrap {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.ten-frame {
  display: grid;
  grid-template-columns: repeat(5, 22px);
  grid-template-rows: repeat(2, 22px);
  gap: 4px;
  padding: 6px;
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 6px;
}

.tf-cell {
  width: 22px;
  height: 22px;
  border: 1px solid #ddd;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tf-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
}

.tf-dot.num-a { background: var(--blue-pen); }
.tf-dot.num-b { background: var(--gold); }
.tf-dot.sub-crossed {
  background: var(--blue-pen);
  opacity: 0.25;
  position: relative;
}
.tf-dot.sub-crossed::after {
  content: "✕";
  position: absolute;
  inset: -3px 0 0 0;
  color: var(--ng);
  font-size: 14px;
  font-weight: 900;
  text-align: center;
}

.visual-caption {
  font-size: 0.82rem;
  color: var(--muted);
  text-align: center;
  margin: 0;
}

/* 花丸スタンプ演出 */
.hanamaru-stamp {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0) rotate(-12deg);
  width: 120px;
  height: 120px;
  pointer-events: none;
  z-index: 10;
  opacity: 0;
  transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
}

.hanamaru-stamp.show {
  transform: translate(-50%, -50%) scale(1) rotate(-12deg);
  opacity: 0.85;
}

.hint-note {
  margin: 6px 0 0;
  min-height: 1.3em;
  text-align: center;
  font-size: 0.84rem;
  color: var(--muted);
}

.answer-field {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* リザルトモーダル（10問完了時） */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(17, 17, 17, 0.55);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(3px);
}

.modal-overlay.show {
  display: flex;
}

.modal-card {
  background: var(--paper);
  border: 3px solid var(--line-strong);
  border-radius: 22px;
  padding: 24px 20px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

.modal-title {
  margin: 0 0 8px;
  font-size: 1.6rem;
  color: var(--blue-pen);
}

.modal-score-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 16px 0;
}

.modal-stat {
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 10px;
}

.modal-stat-label {
  font-size: 0.78rem;
  color: var(--muted);
  display: block;
}

.modal-stat-val {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--ink);
}

.new-record-badge {
  display: inline-block;
  background: var(--gold);
  color: #fff;
  font-size: 0.78rem;
  padding: 2px 10px;
  border-radius: 999px;
  margin-bottom: 10px;
}

.modal-btn {
  appearance: none;
  width: 100%;
  padding: 12px;
  background: var(--blue-pen);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1.05rem;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 0 #123e68;
}

.footer-note {
  margin: 14px 0 0;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
}

@media (max-width: 440px) {
  .header h1 { font-size: 1.4rem; }
  .problem { font-size: 2.8rem; }
  .problem.compact { font-size: 2.3rem; }
  .problem.tight { font-size: 1.8rem; }
  .key { height: 54px; font-size: 1.55rem; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .card.is-vertical-layout .workspace { min-height: 290px; }
}
</style>

/**
 * Web Audio API サウンド合成
 */
let audioCtx = null;
function playTone(type) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    if (type === 'tap') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if (type === 'ok') {
      [523.25, 659.25, 783.99].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.12, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.22);
      });
    } else if (type === 'ng') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.linearRampToValueAtTime(140, now + 0.22);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'fanfare') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.09);
        gain.gain.setValueAtTime(0.15, now + idx * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.09);
        osc.stop(now + idx * 0.09 + 0.35);
      });
    }
  } catch (e) {}
}

/**
 * データの読み込み・保存
 */
function loadUserData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      userData = { ...userData, ...parsed };
    }
  } catch (e) {}

  const today = new Date().toISOString().slice(0, 10);
  if (userData.lastPlayedDate) {
    const last = new Date(userData.lastPlayedDate);
    const curr = new Date(today);
    const diffDays = Math.round((curr - last) / (1000 * 60 * 60 * 24));
    if (diffDays === 1) {
      userData.dayStreak += 1;
    } else if (diffDays > 1) {
      userData.dayStreak = 1;
    }
  } else {
    userData.dayStreak = 1;
  }
  userData.lastPlayedDate = today;
  saveUserData();
  syncHeaderBadges();
}

function saveUserData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
  } catch (e) {}
}

function syncHeaderBadges() {
  dayStreakEl.textContent = userData.dayStreak;
  totalSolvedEl.textContent = userData.totalSolved;
  const mCount = userData.mistakes.length;
  if (mCount > 0) {
    mistakeBadge.hidden = false;
    mistakeBadge.textContent = mCount;
  } else {
    mistakeBadge.hidden = true;
  }
}

/**
 * 乱数・問題生成ロジック
 */
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateNumbers() {
  if (gameMode === 'review' && userData.mistakes.length > 0) {
    const item = userData.mistakes[randInt(0, userData.mistakes.length - 1)];
    currentOp = item.op;
    currentCondition = item.condition || 'no'; // ★復習用に追加
    currentStepId = item.stepId;
    a = item.a;
    b = item.b;
    return;
  }

  let newA = 0, newB = 0;

  for (let i = 0; i < 200; i++) {
    if (currentOp === 'add') {
      if (currentStepId === '1') {
        if (currentCondition === 'no') {
          newA = randInt(1, 8); newB = randInt(1, 9 - newA);
        } else {
          newA = randInt(2, 9); newB = randInt(11 - newA, 9);
        }
      } else if (currentStepId === '2') {
        if (currentCondition === 'no') {
          newA = randInt(11, 88); newB = randInt(11, 88);
          if ((newA % 10) + (newB % 10) >= 10 || Math.floor(newA / 10) + Math.floor(newB / 10) >= 10) continue; 
        } else {
          newA = randInt(12, 89); newB = randInt(12, 89);
          if ((newA % 10) + (newB % 10) < 10) continue;
        }
      } else if (currentStepId === '3') {
        if (currentCondition === 'no') {
          newA = randInt(111, 888); newB = randInt(111, 888);
          if ((newA % 10) + (newB % 10) >= 10 || Math.floor((newA % 100) / 10) + Math.floor((newB % 100) / 10) >= 10 || Math.floor(newA / 100) + Math.floor(newB / 100) >= 10) continue;
        } else {
          newA = randInt(112, 899); newB = randInt(112, 899);
          if ((newA % 10) + (newB % 10) < 10 && Math.floor((newA % 100) / 10) + Math.floor((newB % 100) / 10) < 10) continue;
        }
      }
    } else if (currentOp === 'sub') {
      if (currentStepId === '1') {
        if (currentCondition === 'no') {
          newA = randInt(2, 9); newB = randInt(1, newA - 1);
        } else {
          newA = randInt(11, 18); newB = randInt(newA - 9, 9);
        }
      } else if (currentStepId === '2') {
        if (currentCondition === 'no') {
          newA = randInt(21, 99); newB = randInt(11, newA - 1);
          if ((newA % 10) < (newB % 10)) continue;
        } else {
          newA = randInt(21, 98); newB = randInt(12, newA - 1);
          if ((newA % 10) >= (newB % 10)) continue;
        }
      } else if (currentStepId === '3') {
        if (currentCondition === 'no') {
          newA = randInt(211, 999); newB = randInt(111, newA - 1);
          if ((newA % 10) < (newB % 10) || Math.floor((newA % 100) / 10) < Math.floor((newB % 100) / 10)) continue;
        } else {
          newA = randInt(211, 998); newB = randInt(112, newA - 1);
          if ((newA % 10) >= (newB % 10) && Math.floor((newA % 100) / 10) >= Math.floor((newB % 100) / 10)) continue;
        }
      }
    } else if (currentOp === 'mul') {
      if (currentStepId === '1') {
        newA = randInt(2, 9);
        newB = randInt(2, 9);
      } else if (currentStepId === '2_1') {
        newA = randInt(12, 98);
        newB = randInt(2, 9);
      } else {
        newA = randInt(12, 69);
        newB = randInt(12, 39);
      }
    } else if (currentOp === 'div') {
      if (currentStepId === '1') {
        newB = randInt(2, 9);
        const q = randInt(2, 9);
        newA = newB * q;
      } else if (currentStepId === '2') {
        newB = randInt(2, 8);
        const q = randInt(12, Math.floor(98 / newB));
        newA = newB * q;
      } else {
        newB = randInt(3, 18);
        const q = randInt(12, Math.floor(890 / newB));
        newA = newB * q;
      }
    }

    if (newA !== lastA || newB !== lastB) break;
  }

  a = newA;
  b = newB;
  lastA = a;
  lastB = b;
}




function getCorrectAnswer() {
  switch (currentOp) {
    case 'add': return a + b;
    case 'sub': return a - b;
    case 'mul': return a * b;
    case 'div': return Math.floor(a / b);
    default: return 0;
  }
}

/**
 * 筆算の途中計算・解答HTML生成ロジック
 */
function buildGridTable(rows, rowClasses = [], cellDecorations = {}) {
  let html = '<table class="hissan-sol-table" aria-label="筆算の途中計算">';
  rows.forEach((r, rIdx) => {
    const cls = rowClasses[rIdx] ? ` class="${rowClasses[rIdx]}"` : '';
    html += `<tr${cls}>`;
    r.forEach((cellVal, cIdx) => {
      const key = `${rIdx}_${cIdx}`;
      const tdCls = cellDecorations[key] ? ` class="${cellDecorations[key]}"` : '';
      html += `<td${tdCls}>${cellVal !== undefined && cellVal !== null ? cellVal : ''}</td>`;
    });
    html += '</tr>';
  });
  html += '</table>';
  return html;
}

function generateVerticalSolutionHTML(op, numA, numB) {
if (op === 'add') {
    const ans = numA + numB;
    const sA = String(numA), sB = String(numB), sAns = String(ans);
    const maxLen = Math.max(sA.length, sB.length, sAns.length);
    const cols = maxLen + 1;

    // 上の数
    const rowA = Array(cols).fill('');
    for (let i = 0; i < sA.length; i++) rowA[cols - sA.length + i] = sA[i];

    // 下の数
    const rowB = Array(cols).fill('');
    rowB[0] = '＋';
    for (let i = 0; i < sB.length; i++) rowB[cols - sB.length + i] = sB[i];

    // 繰り上がりの計算と配置（＋記号なしで位の右下に小さく配置）
    let hasCarry = false;
    let c = 0;
    for (let i = 0; i < maxLen; i++) {
      const dA = i < sA.length ? Number(sA[sA.length - 1 - i]) : 0;
      const dB = i < sB.length ? Number(sB[sB.length - 1 - i]) : 0;
      const sum = dA + dB + c;
      c = Math.floor(sum / 10);
      if (c > 0 && (cols - 2 - i) >= 0) {
        const targetCol = cols - 2 - i;
        // 既存の数字（あれば）の後ろにspan要素として追加
        rowB[targetCol] = rowB[targetCol] + `<span class="carry-digit">${c}</span>`;
        hasCarry = true;
      }
    }

    // 答え
    const rowAns = Array(cols).fill('');
    for (let i = 0; i < sAns.length; i++) rowAns[cols - sAns.length + i] = sAns[i];

    // テーブルの行を組み立てる
    const rows = [rowA, rowB, rowAns];
    const classes = ['', 'line-bottom', 'ans-row'];

    return {
      html: buildGridTable(rows, classes),
      note: hasCarry ? '小さく赤字で書かれた数はくりあがった数です。一の位から順に加えます。' : '位をそろえて一の位からたし算します。'
    };
  }

  if (op === 'sub') {
    const ans = numA - numB;
    const sA = String(numA), sB = String(numB), sAns = String(ans);
    const maxLen = Math.max(sA.length, sB.length, sAns.length);
    const cols = maxLen + 1;

    const digitsA = sA.split('').map(Number);
    const origA = [...digitsA];
    const lenA = digitsA.length;

    for (let i = 0; i < lenA; i++) {
      const idxA = lenA - 1 - i;
      const idxB = sB.length - 1 - i;
      const dB = idxB >= 0 ? Number(sB[idxB]) : 0;
      if (digitsA[idxA] < dB) {
        let j = idxA - 1;
        while (j >= 0 && digitsA[j] === 0) {
          digitsA[j] = 9;
          j--;
        }
        if (j >= 0) digitsA[j] -= 1;
        digitsA[idxA] += 10;
      }
    }

    const borrowRow = Array(cols).fill('');
    const rowA = Array(cols).fill('');
    let hasBorrow = false;

    for (let i = 0; i < lenA; i++) {
      const colIdx = cols - lenA + i;
      if (digitsA[i] !== origA[i]) {
        hasBorrow = true;
        borrowRow[colIdx] = digitsA[i];
        rowA[colIdx] = `<span class="crossed-digit">${origA[i]}</span>`;
      } else {
        rowA[colIdx] = origA[i];
      }
    }

    const rowB = Array(cols).fill('');
    rowB[0] = '−';
    for (let i = 0; i < sB.length; i++) rowB[cols - sB.length + i] = sB[i];

    const rowAns = Array(cols).fill('');
    for (let i = 0; i < sAns.length; i++) rowAns[cols - sAns.length + i] = sAns[i];

    const rows = hasBorrow ? [borrowRow, rowA, rowB, rowAns] : [rowA, rowB, rowAns];
    const classes = hasBorrow
      ? ['carry-row', '', 'line-bottom', 'ans-row']
      : ['', 'line-bottom', 'ans-row'];

    return {
      html: buildGridTable(rows, classes),
      note: hasBorrow ? '引けないときは上の位から1くりさげて計算します。' : '位をそろえて一の位からひき算します。'
    };
  }

  if (op === 'mul') {
    const ans = numA * numB;
    const sA = String(numA), sB = String(numB), sAns = String(ans);
    const maxLen = Math.max(sA.length, sB.length, sAns.length);
    const cols = maxLen + 1;

    const rowA = Array(cols).fill('');
    for (let i = 0; i < sA.length; i++) rowA[cols - sA.length + i] = sA[i];

    const rowB = Array(cols).fill('');
    rowB[0] = '×';
    for (let i = 0; i < sB.length; i++) rowB[cols - sB.length + i] = sB[i];

    const rows = [rowA, rowB];
    const classes = ['', 'line-bottom'];

    if (sB.length >= 2) {
      for (let i = 0; i < sB.length; i++) {
        const dB = Number(sB[sB.length - 1 - i]);
        const partVal = numA * dB;
        const sPart = String(partVal);
        const rPart = Array(cols).fill('');
        for (let k = 0; k < sPart.length; k++) {
          const targetCol = cols - i - sPart.length + k;
          if (targetCol >= 0) rPart[targetCol] = sPart[k];
        }
        rows.push(rPart);
        classes.push(i === sB.length - 1 ? 'partial-row line-bottom' : 'partial-row');
      }
    }

    const rowAns = Array(cols).fill('');
    for (let i = 0; i < sAns.length; i++) rowAns[cols - sAns.length + i] = sAns[i];
    rows.push(rowAns);
    classes.push('ans-row');

    const noteText = sB.length >= 2
      ? `${numA}×${sB[sB.length - 1]}＝${numA * Number(sB[sB.length - 1])} と ${numA}×${sB[0]}0＝${numA * Number(sB[0]) * 10} をたし合わせます。`
      : '下の数（かける数）を上のそれぞれの位に順番にかけます。';

    return {
      html: buildGridTable(rows, classes),
      note: noteText
    };
  }

  if (op === 'div') {
    const q = Math.floor(numA / numB);
    const sA = String(numA), sB = String(numB), sQ = String(q);
    const divCols = sB.length;
    const totalCols = divCols + sA.length;

    const rows = [];
    const classes = [];
    const cellDecorations = {};

    // 1行目：商（こたえ）
    const rowQ = Array(totalCols).fill('');
    for (let i = 0; i < sQ.length; i++) {
      rowQ[totalCols - sQ.length + i] = sQ[i];
    }
    rows.push(rowQ);
    classes.push('ans-row');

    // 2行目：わる数 ＋ 曲線払いの筆算記号 ＋ わられる数
    const rowProb = Array(totalCols).fill('');
    for (let i = 0; i < sB.length; i++) rowProb[i] = sB[i];
    const curveSvg = `<svg class="sol-div-curve-svg" viewBox="0 0 18 44" preserveAspectRatio="none" aria-hidden="true"><path d="M 12 1 C 16 17, 11 34, 1 43" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></svg>`;
    for (let i = 0; i < sA.length; i++) {
      const col = divCols + i;
      rowProb[col] = (i === 0) ? `${curveSvg}${sA[i]}` : sA[i];
      cellDecorations[`1_${col}`] = (i === 0) ? 'div-curve-cell' : 'div-top-bar';
    }
    rows.push(rowProb);
    classes.push('');

    // 長除法の各ステップ（すべての横棒を割られる数の全桁数分の長さに統一）
    let currentRem = 0;
    for (let i = 0; i < sA.length; i++) {
      currentRem = currentRem * 10 + Number(sA[i]);
      const stepQ = Math.floor(currentRem / numB);

      if (stepQ > 0 || (i === sA.length - 1)) {
        const prod = stepQ * numB;
        const sProd = String(prod);
        const rProd = Array(totalCols).fill('');
        const endCol = divCols + i;
        const startCol = endCol - sProd.length + 1;

        for (let k = 0; k < sProd.length; k++) {
          const c = startCol + k;
          if (c >= 0) rProd[c] = sProd[k];
        }

        // 割られる数の全ケタ数分（divCols から totalCols - 1 まで）横棒を引く
        const prodRowIdx = rows.length;
        for (let c = divCols; c < totalCols; c++) {
          cellDecorations[`${prodRowIdx}_${c}`] = 'sub-line-bottom';
        }
        rows.push(rProd);
        classes.push('partial-row');

        currentRem = currentRem - prod;

        // 次の桁をおろす、または最後の余り0を表示
        if (i < sA.length - 1) {
          const nextDigit = sA[i + 1];
          const nextValStr = (currentRem > 0 ? String(currentRem) : '') + nextDigit;
          const rNext = Array(totalCols).fill('');
          const nextEndCol = divCols + i + 1;
          for (let k = 0; k < nextValStr.length; k++) {
            rNext[nextEndCol - nextValStr.length + 1 + k] = nextValStr[k];
          }
          rows.push(rNext);
          classes.push('');
        } else {
          const rZero = Array(totalCols).fill('');
          rZero[endCol] = String(currentRem);
          rows.push(rZero);
          classes.push('');
        }
      }
    }

    return {
      html: buildGridTable(rows, classes, cellDecorations),
      note: '上の位から「商をたてる → かける → ひく → 次の位をおろす」の順に進めます。'
    };
  }

  return { html: '', note: '' };
}

function renderVisualAid() {
  const canUseTenFrame = (currentOp === 'add' || currentOp === 'sub') && (a <= 20 && b <= 20 && (a + b) <= 20);
  visualToggleBtn.disabled = !canUseTenFrame;

  if (!canUseTenFrame || !showVisualAid) {
    visualAid.classList.remove('active');
    return;
  }

  visualAid.classList.add('active');
  tenFramesContainer.innerHTML = '';

  const totalCellsNeeded = (currentOp === 'add' ? (a + b > 10) : (a > 10)) ? 20 : 10;
  const frameCount = totalCellsNeeded / 10;

  for (let f = 0; f < frameCount; f++) {
    const frame = document.createElement('div');
    frame.className = 'ten-frame';
    for (let c = 0; c < 10; c++) {
      const idx = f * 10 + c;
      const cell = document.createElement('div');
      cell.className = 'tf-cell';

      if (currentOp === 'add') {
        if (idx < a) {
          const dot = document.createElement('div');
          dot.className = 'tf-dot num-a';
          cell.appendChild(dot);
        } else if (idx < a + b) {
          const dot = document.createElement('div');
          dot.className = 'tf-dot num-b';
          cell.appendChild(dot);
        }
      } else if (currentOp === 'sub') {
        if (idx < a) {
          const dot = document.createElement('div');
          if (idx >= a - b) {
            dot.className = 'tf-dot sub-crossed';
          } else {
            dot.className = 'tf-dot num-a';
          }
          cell.appendChild(dot);
        }
      }
      frame.appendChild(cell);
    }
    tenFramesContainer.appendChild(frame);
  }

  if (currentOp === 'add') {
    if (a + b > 10 && a < 10) {
      const needForTen = 10 - a;
      const rest = b - needForTen;
      visualCaption.textContent = `青(${a}) に あと ${needForTen} で 10のまとまり！ のこりは ${rest} だから…`;
    } else {
      visualCaption.textContent = `青が ${a}こ、黄色が ${b}こ。あわせていくつ？`;
    }
  } else {
    visualCaption.textContent = `${a}こ から ${b}こ(✕印) をひくと、のこりはいくつ？`;
  }
}

/**
 * UI更新と同期
 */
function getCurrentStepObj() {
  const steps = OP_META[currentOp].steps;
  return steps.find(s => s.id === currentStepId) || steps[0];
}

function renderStepChips() {
  const meta = OP_META[currentOp];

  // くりあがり・くりさがりメニューの生成
  if (meta.hasCondition) {
    subCategoryRow.style.display = 'flex';
    subCategoryLabel.textContent = meta.conditionLabel;
    if (!meta.conditions.some(c => c.id === currentCondition)) {
      currentCondition = meta.conditions[0].id;
    }
    subCategoryMenu.innerHTML = '';
    meta.conditions.forEach(cond => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (cond.id === currentCondition ? ' active' : '');
      btn.textContent = cond.label;
      btn.addEventListener('click', () => {
        currentCondition = cond.id;
        applyModeUI();
        resetSessionIfTimeMode();
        newProblem();
      });
      subCategoryMenu.appendChild(btn);
    });
  } else {
    subCategoryRow.style.display = 'none';
  }

  // ステップ（1けた等）メニューの生成
  const steps = meta.steps;
  if (!steps.some(s => s.id === currentStepId)) {
    currentStepId = steps[0].id;
  }
  digitMenu.innerHTML = '';
  steps.forEach(st => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (st.id === currentStepId ? ' active' : '');
    btn.textContent = st.label;
    btn.addEventListener('click', () => {
      currentStepId = st.id;
      applyModeUI();
      resetSessionIfTimeMode();
      newProblem();
    });
    digitMenu.appendChild(btn);
  });
}

function syncScratchUI() {
  scratchCanvas.classList.toggle('active', isScratchActive);
  scratchCanvas.classList.toggle('is-eraser', isScratchActive && scratchTool === 'eraser');

  scratchToggleBtn.classList.toggle('active', isScratchActive && scratchTool === 'pen');
  scratchEraserBtn.classList.toggle('eraser-active', isScratchActive && scratchTool === 'eraser');

  scratchEraserBtn.hidden = !isScratchActive;
  scratchClearBtn.hidden = !isScratchActive;
}

function applyModeUI() {
  renderStepChips();
  const meta = OP_META[currentOp];
  const stepObj = getCurrentStepObj();

  if (gameMode === 'review') {
    subTitle.textContent = `ニガテ復習モード（のこり ${userData.mistakes.length}問）`;
  } else {
    subTitle.textContent = `${meta.labelJa}：${stepObj.label}`;
  }

  opSymbolEl.textContent = meta.symbol;
  hintNote.textContent = stepObj.hint || '';

  verticalToggleBtn.disabled = false;
  verticalToggleBtn.classList.toggle('active', isVerticalMode);
  mainCard.classList.toggle('is-vertical-layout', isVerticalMode);
  appContainer.classList.toggle('is-vertical-app', isVerticalMode);

  if (isVerticalMode) {
    // 筆算モード時は必ず手書きメモをONにし、答え入力欄を右カラムへ移動
    isScratchActive = true;
    if (!rightAnswerSlot.contains(answerArea)) {
      rightAnswerSlot.appendChild(answerArea);
    }
    renderVerticalProblem();
  } else {
    if (!inlineAnswerSlot.contains(answerArea)) {
      inlineAnswerSlot.appendChild(answerArea);
    }
    problemEl.classList.remove('compact', 'tight');
    if (stepObj.digits === 2 || currentOp === 'mul' || currentOp === 'div') {
      problemEl.classList.add('compact');
    }
    if (stepObj.digits === 3) {
      problemEl.classList.add('tight');
    }
  }

  syncScratchUI();

  opMenu.querySelectorAll('.chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.op === currentOp);
  });

  gameModeMenu.querySelectorAll('.chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === gameMode);
  });

  if (gameMode === 'time10') {
    progressWrap.classList.add('active');
    updateProgressUI();
  } else {
    progressWrap.classList.remove('active');
  }

  setTimeout(resizeCanvas, 300);
}

function updateProgressUI() {
  progressText.textContent = `${Math.min(time10Progress + 1, 10)} / 10 問目`;
  progressFill.style.width = `${(time10Progress / 10) * 100}%`;

const condStr = OP_META[currentOp].hasCondition ? `_${currentCondition}` : '';
const key = `${currentOp}${condStr}_${currentStepId}`;

  const best = userData.bestTimes[key];
  bestTimeText.textContent = best ? `👑 ベスト: ${best.toFixed(1)}秒` : '👑 ベスト: --.-秒';
}

function syncAnswerUI() {
  if (answerBuffer === '') {
    answerDisplay.textContent = '?';
    answerDisplay.classList.remove('filled');
  } else {
    answerDisplay.textContent = answerBuffer;
    answerDisplay.classList.add('filled');
  }
  answerInput.value = answerBuffer;
}

function clearAnswer() {
  answerBuffer = '';
  syncAnswerUI();
}

function appendDigit(digit) {
  if (locked) return;
  playTone('tap');
  if (answerBuffer === '0') {
    answerBuffer = String(digit);
  } else if (answerBuffer.length < 6) {
    answerBuffer += String(digit);
  }
  syncAnswerUI();
}

function backspace() {
  if (locked) return;
  playTone('tap');
  answerBuffer = answerBuffer.slice(0, -1);
  syncAnswerUI();
}

function focusAnswerInput() {
  answerInput.focus({ preventScroll: true });
  answerArea.classList.add('is-focused');
}

function setKeypadEnabled(enabled) {
  keypad.querySelectorAll('.key').forEach(k => k.disabled = !enabled);
}

/**
 * タイマー制御
 */
function startStopwatch() {
  stopStopwatch();
  startTime = performance.now() - (elapsedSec * 1000);
  timerInterval = setInterval(() => {
    elapsedSec = (performance.now() - startTime) / 1000;
    timerDisplayEl.textContent = `${elapsedSec.toFixed(1)}s`;
  }, 100);
}

function stopStopwatch() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function resetStopwatch() {
  stopStopwatch();
  elapsedSec = 0;
  timerDisplayEl.textContent = '0.0s';
}

function resetSessionIfTimeMode() {
  if (gameMode === 'time10') {
    time10Progress = 0;
    correctCount = 0;
    wrongCount = 0;
    streak = 0;
    updateScoreboard();
    resetStopwatch();
    updateProgressUI();
  }
}

/**
 * 新しい問題の出題
 */
function newProblem() {
  if (problemTimer) {
    clearTimeout(problemTimer);
    problemTimer = null;
  }

  hanamaruStamp.classList.remove('show');
  hideVerticalSolutionPanel();
  clearScratchPad();
  // 新しい問題ではペンモードに戻す
  scratchTool = 'pen';
  syncScratchUI();

  if (gameMode === 'review' && userData.mistakes.length === 0) {
    feedbackEl.className = 'feedback ok';
    feedbackTextEl.textContent = 'ニガテな問題はすべてクリアしました！🎉';
    gameMode = 'free';
    applyModeUI();
  }

  generateNumbers();
  if (gameMode === 'review') applyModeUI();

  numAEl.textContent = a;
  numBEl.textContent = b;
  renderVerticalProblem();
  clearAnswer();
  answerArea.classList.remove('is-ok', 'is-ng');

  feedbackTextEl.textContent = '';
  feedbackEl.className = 'feedback empty';
  nextProblemBtn.hidden = true;
  nextProblemBtn.classList.remove('ok-next');

  locked = false;
  setKeypadEnabled(true);
  renderVisualAid();
  setTimeout(resizeCanvas, 300);
  focusAnswerInput();

  if (gameMode === 'time10' && time10Progress === 0 && elapsedSec === 0) {
    startStopwatch();
  } else if (gameMode !== 'time10') {
    resetStopwatch();
    startStopwatch();
  }
}

function updateScoreboard() {
  correctCountEl.textContent = correctCount;
  wrongCountEl.textContent = wrongCount;
  streakCountEl.textContent = streak;
}

/**
 * 解答判定
 */
function submitAnswer() {
  if (locked) return;

  // 未入力のまま答える（Enter）を押した場合は「スキップ」として次の問題へ
  if (answerBuffer === '') {
    newProblem();
    return;
  }

  const userAnswer = parseInt(answerBuffer, 10);
  if (Number.isNaN(userAnswer)) return;

  const ans = getCorrectAnswer();
  locked = true;
  setKeypadEnabled(false);

  if (gameMode !== 'time10') stopStopwatch();

  if (userAnswer === ans) {
    playTone('ok');
    correctCount += 1;
    streak += 1;
    userData.totalSolved += 1;

    if (gameMode === 'review') {
      userData.mistakes = userData.mistakes.filter(
        m => !(m.op === currentOp && m.a === a && m.b === b)
      );
    }

    saveUserData();
    syncHeaderBadges();

    feedbackEl.className = 'feedback ok';
    feedbackTextEl.textContent = `せいかい！ ${a} ${OP_META[currentOp].symbol} ${b} ＝ ${ans}`;
    answerArea.classList.add('is-ok');
    hanamaruStamp.classList.add('show');

    if (gameMode === 'time10') {
      time10Progress += 1;
      updateProgressUI();
      if (time10Progress >= 10) {
        stopStopwatch();
        if (isVerticalMode) showVerticalSolutionPanel();
        setTimeout(showTimeAttackResult, 650);
        updateScoreboard();
        return;
      }
    }

    if (isVerticalMode) {
      showVerticalSolutionPanel();
      nextProblemBtn.hidden = false;
      nextProblemBtn.classList.add('ok-next');
      setTimeout(() => vSolNextBtn.focus(), 50);
    } else {
      problemTimer = setTimeout(newProblem, 650);
    }
  } else {
    playTone('ng');
    wrongCount += 1;
    streak = 0;

    const exists = userData.mistakes.some(
      m => m.op === currentOp && m.a === a && m.b === b
    );
    if (!exists) {
      userData.mistakes.push({ op: currentOp, condition: currentCondition, stepId: currentStepId, a, b });
      saveUserData();
      syncHeaderBadges();
    }

    feedbackEl.className = 'feedback ng';
    feedbackTextEl.textContent = `おしい！ 正解は ${ans}`;
    nextProblemBtn.hidden = false;
    nextProblemBtn.classList.remove('ok-next');
    answerArea.classList.add('is-ng');

    if (isVerticalMode) {
      showVerticalSolutionPanel();
      setTimeout(() => vSolNextBtn.focus(), 50);
    } else {
      if ((currentOp === 'add' || currentOp === 'sub') && a <= 20 && b <= 20 && (a + b) <= 20) {
        showVisualAid = true;
        visualToggleBtn.classList.add('active');
        renderVisualAid();
      }
      setTimeout(() => nextProblemBtn.focus(), 50);
    }
  }

  updateScoreboard();
}

/**
 * 10問タイムアタック結果表示
 */
function showTimeAttackResult() {
  playTone('fanfare');
  const totalTime = Number(elapsedSec.toFixed(1));
  const totalAttempts = correctCount + wrongCount;
  const acc = totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 100;


const condStr = OP_META[currentOp].hasCondition ? `_${currentCondition}` : '';
const key = `${currentOp}${condStr}_${currentStepId}`;

  const prevBest = userData.bestTimes[key];
  let isNewRecord = false;

  if (!prevBest || totalTime < prevBest) {
    userData.bestTimes[key] = totalTime;
    saveUserData();
    isNewRecord = true;
  }

  newRecordBadge.hidden = !isNewRecord;
  const stepObj = getCurrentStepObj();
  modalSubText.textContent = `${OP_META[currentOp].labelJa}（${stepObj.label}）`;
  modalTimeVal.textContent = `${totalTime}秒`;
  modalAccVal.textContent = `${acc}%`;
  resultModal.classList.add('show');
}

modalCloseBtn.addEventListener('click', () => {
  resultModal.classList.remove('show');
  resetSessionIfTimeMode();
  newProblem();
});

/**
 * 手書きメモ（ペン ＆ 部分消しゴム対応）
 */
const ctx = scratchCanvas.getContext('2d');
let drawing = false;

function resizeCanvas() {
  const rect = workspace.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;
  if (scratchCanvas.width === Math.floor(rect.width) && scratchCanvas.height === Math.floor(rect.height)) return;

  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = scratchCanvas.width;
  tempCanvas.height = scratchCanvas.height;
  if (tempCanvas.width > 0 && tempCanvas.height > 0) {
    tempCanvas.getContext('2d').drawImage(scratchCanvas, 0, 0);
  }

  scratchCanvas.width = Math.floor(rect.width);
  scratchCanvas.height = Math.floor(rect.height);
  if (tempCanvas.width > 0 && tempCanvas.height > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(tempCanvas, 0, 0);
    ctx.restore();
  }
}

window.addEventListener('resize', resizeCanvas);

function clearScratchPad() {
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, scratchCanvas.width, scratchCanvas.height);
  ctx.restore();
}

function getPos(e) {
  const rect = scratchCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  // ★内部解像度と表示サイズのズレを自動計算して補正する
  const scaleX = scratchCanvas.width / rect.width;
  const scaleY = scratchCanvas.height / rect.height;
  return { 
    x: (clientX - rect.left) * scaleX, 
    y: (clientY - rect.top) * scaleY 
  };
}
scratchCanvas.addEventListener('pointerdown', (e) => {
  if (!isScratchActive) return;
  drawing = true;
  scratchCanvas.setPointerCapture(e.pointerId);
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (scratchTool === 'eraser') {
    // 描いた線だけを部分的に透明化して消す
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 24;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(26, 86, 142, 0.78)';
    ctx.lineWidth = 3;
  }
  // ワンタップでも点・消去が効くように微小描画
  ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
  ctx.stroke();
});

scratchCanvas.addEventListener('pointermove', (e) => {
  if (!drawing || !isScratchActive) return;
  const pos = getPos(e);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
});

window.addEventListener('pointerup', () => {
  if (drawing) {
    drawing = false;
    ctx.globalCompositeOperation = 'source-over';
  }
});

/**
 * イベントリスナー設定
 */
opMenu.addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  currentOp = btn.dataset.op;
  currentStepId = OP_META[currentOp].steps[0].id;
  applyModeUI();
  resetSessionIfTimeMode();
  newProblem();
});

gameModeMenu.addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  const mode = btn.dataset.mode;
  if (mode === 'review' && userData.mistakes.length === 0) {
    feedbackEl.className = 'feedback ok';
    feedbackTextEl.textContent = '現在、復習するニガテ問題はありません！✨';
    return;
  }
  gameMode = mode;
  applyModeUI();
  resetSessionIfTimeMode();
  newProblem();
});

visualToggleBtn.addEventListener('click', () => {
  showVisualAid = !showVisualAid;
  visualToggleBtn.classList.toggle('active', showVisualAid);
  renderVisualAid();
  focusAnswerInput();
});

verticalToggleBtn.addEventListener('click', () => {
  isVerticalMode = !isVerticalMode;
  if (isVerticalMode) {
    isScratchActive = true;
    scratchTool = 'pen';
  }
  applyModeUI();
  if (locked) {
    if (isVerticalMode) showVerticalSolutionPanel();
    else hideVerticalSolutionPanel();
  }
  focusAnswerInput();
});

scratchToggleBtn.addEventListener('click', () => {
  if (isVerticalMode) {
    // 筆算モード時は手書き常時ONのため、ペンへの切り替えとして動作
    scratchTool = 'pen';
  } else {
    if (!isScratchActive) {
      isScratchActive = true;
      scratchTool = 'pen';
    } else if (scratchTool === 'eraser') {
      scratchTool = 'pen';
    } else {
      isScratchActive = false;
    }
  }
  syncScratchUI();
  resizeCanvas();
});

scratchEraserBtn.addEventListener('click', () => {
  if (!isScratchActive) return;
  scratchTool = (scratchTool === 'eraser') ? 'pen' : 'eraser';
  syncScratchUI();
});

scratchClearBtn.addEventListener('click', () => {
  clearScratchPad();
  scratchTool = 'pen';
  syncScratchUI();
  focusAnswerInput();
});

soundToggleBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundToggleBtn.classList.toggle('active', soundEnabled);
  soundToggleBtn.textContent = soundEnabled ? '🔊 音 ON' : '🔇 音 OFF';
});

keypad.addEventListener('click', (e) => {
  const btn = e.target.closest('.key');
  if (!btn || btn.disabled) return;
  const key = btn.dataset.key;
  if (key === 'clear') clearAnswer();
  else if (key === 'back') backspace();
  else if (key === 'submit') submitAnswer();
  else appendDigit(key);
  focusAnswerInput();
});

nextProblemBtn.addEventListener('click', newProblem);
vSolNextBtn.addEventListener('click', newProblem);

resetBtn.addEventListener('click', () => {
  correctCount = 0;
  wrongCount = 0;
  streak = 0;
  time10Progress = 0;
  updateScoreboard();
  resetStopwatch();
  updateProgressUI();
  newProblem();
});

document.addEventListener('keydown', (e) => {
  if (resultModal.classList.contains('show')) {
    if (e.key === 'Enter') modalCloseBtn.click();
    return;
  }
  if (locked) {
    if (e.key === 'Enter' && (!nextProblemBtn.hidden || !verticalSolutionPanel.hidden)) {
      e.preventDefault();
      newProblem();
    }
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    submitAnswer();
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    backspace();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    clearAnswer();
  } else if (e.key >= '0' && e.key <= '9') {
    e.preventDefault();
    appendDigit(e.key);
  }
});

answerArea.addEventListener('click', focusAnswerInput);

// 初期化実行
loadUserData();
applyModeUI();
updateScoreboard();
setTimeout(resizeCanvas, 100);
newProblem();
</script>
